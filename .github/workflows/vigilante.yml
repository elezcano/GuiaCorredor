# Vigilante de webs oficiales (scripts/vigilante.mjs). HU-130 (decisión 22): lo que Gendarmería o Vialidad
# publican en la web oficial de cada paso se escribe en data/pasos.json, y el estado de las carreteras
# (Vialidad Nacional y Vialidad de Chile) en data/incidencias.json; se comprueba (npm run check), se
# sube a main y se publica al momento. Después avisa por correo, con una incidencia, de lo publicado.
name: Vigilante de webs oficiales

on:
  # Cada hora, de 06 a 21 h de Argentina (09 a 00 UTC). GitHub retrasa o se salta a menudo las tareas
  # programadas; pasar cada hora asegura varias pasadas al día. No genera más correos: como mucho una
  # incidencia por paso y día, y solo si hay un parte más nuevo que el cargado.
  schedule:
    - cron: '17 0,9-23 * * *'
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Abrir una incidencia de prueba para comprobar el correo'
        type: boolean
        default: false
  # En una PR que toque el vigilante: comprueba el lector. Con la etiqueta «prueba-vigilante», además abre una incidencia de prueba.
  pull_request:
    types: [opened, synchronize, labeled]
    paths: ['scripts/vigilante.mjs', 'scripts/carreteras.mjs', 'scripts/mopc.mjs', 'scripts/fuentes-vigilancia.mjs', 'data/fuentes-vigilancia.csv', '.github/workflows/vigilante.yml']

permissions:
  contents: write # HU-129: estado en la rama datos-vigilancia. HU-130: sube a main lo leído de la web oficial
  issues: write
  actions: write # HU-130: lanza «Publicar web» (un push con GITHUB_TOKEN no la lanza por sí solo)

concurrency:
  group: vigilante-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # HU-134: el informe del MOPC es un PDF; se pasa a texto con pdftotext (poppler-utils).
      - name: Instalar pdftotext
        run: command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Comprobar el lector
        run: node scripts/vigilante.mjs --autoprueba
      - name: Prueba de aviso por correo
        if: (github.event_name == 'workflow_dispatch' && inputs.prueba) || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'prueba-vigilante')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/vigilante.mjs --github --prueba
      # HU-129: estado de la vigilancia (cuándo se leyó bien cada fuente) en la rama datos-vigilancia.
      - name: Traer el estado de la vigilancia
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.prueba)
        run: |
          git fetch --depth=1 origin datos-vigilancia 2>/dev/null && git show FETCH_HEAD:vigilancia.json > "$RUNNER_TEMP/vigilancia.json" || echo '{}' > "$RUNNER_TEMP/vigilancia.json"
      - name: Vigilar
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.prueba)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIGILANCIA_ARCHIVO: ${{ runner.temp }}/vigilancia.json
          VIGILANCIA_CAMBIOS: ${{ runner.temp }}/cambios.json
        run: node scripts/vigilante.mjs --github --escribir
      # HU-130: si hay algo nuevo, se comprueba, se sube a main y se publica la web.
      - name: Publicar lo leído
        id: publicar
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.prueba)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/pasos.json data/incidencias.json; then echo "Nada que publicar."; exit 0; fi
          git diff --stat -- data/pasos.json data/incidencias.json
          npm install --no-audit --no-fund
          if ! npm run check; then
            echo "publicado=0" >> "$GITHUB_OUTPUT"
            echo "::error::La comprobación de datos falla con lo leído: no se publica."
            git checkout -- data/pasos.json data/incidencias.json
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pasos.json data/incidencias.json
          git commit -q -m "Vigilante: lo leído de la web oficial ($(TZ=America/Argentina/Salta date '+%d/%m %H:%M') hora de Argentina)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          gh workflow run publicar.yml --ref main
          echo "publicado=1" >> "$GITHUB_OUTPUT"
      - name: Avisar de lo publicado
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.prueba)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIGILANCIA_CAMBIOS: ${{ runner.temp }}/cambios.json
          PUBLICADO: ${{ steps.publicar.outputs.publicado }}
        run: node scripts/vigilante.mjs --github --avisar-publicado
      - name: Guardar el estado de la vigilancia
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.prueba))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dir="$RUNNER_TEMP/estado"
          if git ls-remote --exit-code origin datos-vigilancia >/dev/null 2>&1; then
            git fetch --depth=1 origin datos-vigilancia
            git worktree add -B datos-vigilancia "$dir" FETCH_HEAD
          else
            git worktree add --orphan -b datos-vigilancia "$dir"
          fi
          cp "$RUNNER_TEMP/vigilancia.json" "$dir/vigilancia.json"
          cd "$dir"
          git add vigilancia.json
          git commit -q -m "Estado de la vigilancia $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push -q origin datos-vigilancia
      - name: Leer sin avisar (PR)
        if: github.event_name == 'pull_request'
        run: node scripts/vigilante.mjs
