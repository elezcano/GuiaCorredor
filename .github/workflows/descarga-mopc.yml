# Uso único (HU-134): prueba el lector del MOPC contra Drive con el código de la rama hu-134-mopc. Se borra al terminar la HU.
name: Descarga MOPC
on:
  push:
    branches: [descarga-mopc]
    paths: [.github/workflows/descarga-mopc.yml]
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hu-134-mopc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - run: node scripts/vigilante.mjs 2>&1 | tee salida.txt
      - run: grep -i "MOPC\|Paraguay\|⚠" salida.txt | while IFS= read -r l; do echo "::notice::$l"; done
