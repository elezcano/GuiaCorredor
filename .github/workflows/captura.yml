name: Captura temporal del mapa
on:
  push:
    branches: [captura-mapa]
jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: |
          cat > /tmp/c.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ timezoneId: 'America/Argentina/Salta', locale: 'es-AR' });
            for (const u of ['https://www.argentina.gob.ar/seguridad/pasosinternacionales/detalle/ruta/19/Jama','https://www.argentina.gob.ar/seguridad/pasosinternacionales/detalle/ruta/20/Sico']) {
              const p = await ctx.newPage();
              const reqs = [];
              p.on('response', (r) => { const ct = r.headers()['content-type'] || ''; if (/json/.test(ct)) reqs.push(r.url()); });
              await p.goto(u, { waitUntil: 'networkidle', timeout: 60000 });
              await p.waitForTimeout(3000);
              const t = (await p.innerText('main').catch(() => p.innerText('body'))).replace(/\n{2,}/g, '\n');
              const i = t.indexOf('Lado argentino');
              console.log('=== ' + u); console.log(t.slice(Math.max(0, i), i + 1500));
              console.log('JSON:', reqs.slice(0, 15).join('\n'));
              const html = await (await fetch(u)).text();
              console.log('HTML estatico contiene Cerrado/Abierto/Atención:', /Cerrado/.test(html), /Abierto/.test(html), /Atenci/.test(html), /Habilitado/.test(html));
            }
            await b.close();
          })();
          JS
          node /tmp/c.cjs
