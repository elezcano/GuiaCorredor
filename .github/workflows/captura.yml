name: Captura temporal del mapa
on:
  push:
    branches: [captura-mapa]
jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - run: |
          base='https://rest-sit.mop.gob.cl/arcgis/rest/services/VIALIDAD/Emergencias_Vialidad/MapServer'
          for i in 1 2 3; do
            curl -sS -A 'GuiaCorredor-vigilante (+https://elezcano.github.io/GuiaCorredor/)' "$base/0/query?where=REGION%20IN%20('01','02')&outFields=ROL,KM_INICIO_SEGMENTO,FECHA,last_edited_date&returnGeometry=true&outSR=4326&f=json" | python3 -c "import json,sys;d=json.load(sys.stdin);print('N',len(d.get('features',[])),d.get('error'));[print(f['attributes'],f.get('geometry')) for f in d.get('features',[]) if f['attributes']['ROL'] in ('Ruta 1','Ruta 16')]"
            sleep 5
          done
