name: Captura temporal del mapa
on:
  push:
    branches: [captura-mapa]
jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: |
          cat > /tmp/c.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const paginas = [
            'https://www.argentina.gob.ar/obras-publicas/vialidad-nacional/estado-de-las-rutas',
            'https://www.argentina.gob.ar/rutasnacionales',
            'https://sitministerial.maps.arcgis.com/apps/webappviewer/index.html?id=500fa188342a4b6cb9acd7b96d5a12d0',
          ];
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ timezoneId: 'America/Argentina/Salta', locale: 'es-AR' });
            for (const u of paginas) {
              const p = await ctx.newPage();
              const reqs = [];
              p.on('response', async (r) => {
                const ct = r.headers()['content-type'] || '';
                if (/json|xml|csv|geo/.test(ct) && !/\.(js|css)(\?|$)/.test(r.url())) {
                  let cuerpo = ''; try { cuerpo = (await r.text()).slice(0, 600).replace(/\s+/g, ' '); } catch {}
                  reqs.push(`${r.status()} ${ct.split(';')[0]} ${r.url()}\n      ${cuerpo}`);
                }
              });
              console.log('\n=== ' + u);
              try { await p.goto(u, { waitUntil: 'networkidle', timeout: 90000 }); } catch (e) { console.log('goto: ' + e.message); }
              await p.waitForTimeout(8000);
              console.log('URL final: ' + p.url());
              const t = (await p.innerText('body').catch(() => '')).replace(/\n{2,}/g, '\n');
              console.log('TEXTO:\n' + t.slice(0, 2500));
              for (const k of ['RN 52', 'RN 51', 'Jama', 'Sico', '52', 'Jujuy']) { const i = t.indexOf(k); if (i >= 0) { console.log(`--- ${k}: ` + t.slice(Math.max(0, i - 200), i + 600)); break; } }
              console.log('PETICIONES (' + reqs.length + '):\n' + reqs.slice(0, 60).join('\n'));
              const iframes = await p.evaluate(() => [...document.querySelectorAll('iframe')].map((f) => f.src));
              console.log('IFRAMES: ' + iframes.join(' | '));
              const enlaces = await p.evaluate(() => [...document.querySelectorAll('a')].map((a) => a.href).filter((h) => /ruta|vial|estado|transit|arcgis|mapa/i.test(h)).slice(0, 40));
              console.log('ENLACES: ' + enlaces.join('\n  '));
            }
            await b.close();
          })();
          JS
          node /tmp/c.cjs
      - run: |
          curl -sS "https://sitministerial.maps.arcgis.com/sharing/rest/content/items/500fa188342a4b6cb9acd7b96d5a12d0/data?f=json" | head -c 4000; echo
