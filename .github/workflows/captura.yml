name: Captura temporal del mapa
on:
  push:
    branches: [captura-mapa]
jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cat > /tmp/e.mjs <<'JS'
          for (const svc of ['Emergencias_Vialidad', 'Pasos_Fronterizos']) {
            const base = `https://rest-sit.mop.gob.cl/arcgis/rest/services/VIALIDAD/${svc}/MapServer`;
            const m = await (await fetch(base + '?f=json')).json();
            console.log('\n#### ' + svc, JSON.stringify(m.layers?.map((l) => [l.id, l.name])), m.error ? JSON.stringify(m.error) : '');
            for (const l of m.layers || []) {
              const meta = await (await fetch(`${base}/${l.id}?f=json`)).json();
              console.log(`-- capa ${l.id} ${l.name} campos: ${(meta.fields || []).map((f) => f.name).join(',')}`);
              const c = await (await fetch(`${base}/${l.id}/query?where=1%3D1&returnCountOnly=true&f=json`)).json();
              console.log('   total', JSON.stringify(c));
              const reg = (meta.fields || []).find((f) => /REGION/i.test(f.name));
              const w = reg ? `${reg.name} LIKE '%ANTOFAGASTA%' OR ${reg.name} LIKE '%Antofagasta%' OR ${reg.name} LIKE '%II%'` : '1=1';
              const q = await (await fetch(`${base}/${l.id}/query?where=${encodeURIComponent(w)}&outFields=*&returnGeometry=false&resultRecordCount=8&f=json`)).json();
              console.log('   ' + JSON.stringify(q.features?.map((f) => f.attributes) || q.error).slice(0, 4000));
            }
          }
          JS
          node /tmp/e.mjs
