name: Captura temporal del mapa
on:
  push:
    branches: [captura-mapa]
jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -q poppler-utils >/dev/null
      - run: |
          cat > /tmp/d.py <<'PY'
          import re, urllib.request, subprocess, html
          UA={'User-Agent':'Mozilla/5.0'}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=60).read()
          def listar(fid):
              h=get(f'https://drive.google.com/embeddedfolderview?id={fid}').decode('utf-8','ignore')
              items=re.findall(r'<a href="([^"]+)"[^>]*>.*?<div class="flip-entry-title">([^<]+)</div>.*?<div class="flip-entry-last-modified"><div>([^<]*)</div>',h,re.S)
              return [(html.unescape(u),html.unescape(t),m) for u,t,m in items]
          raiz=listar('16y2lx1eoOwn532O1F0j-g0Ye7YZj0dWD')
          pass
          nov=[u for u,t,m in raiz if 'NOVIEMBRE' in t.upper()]
          fid=re.search(r'folders/([\w-]+)',nov[0]).group(1) if nov else '1ZgmBceMvSZ9TDlJfiVsN40ED73jWj25o'
          arch=listar(fid)
          pass
          ult=arch[-1] if arch else None
          ids=[re.search(r'/d/([\w-]+)',u).group(1) for u,t,m in arch if re.search(r'/d/([\w-]+)',u)]
          for i,(u,t,m) in enumerate(arch[-1:]):
              fi=re.search(r'/d/([\w-]+)',u)
              if not fi: continue
              open('/tmp/p.pdf','wb').write(get(f'https://drive.google.com/uc?export=download&id={fi.group(1)}'))
              print('=== PDF',t, subprocess.run(['pdfinfo','/tmp/p.pdf'],capture_output=True,text=True).stdout[:400])
              txt=subprocess.run(['pdftotext','-layout','/tmp/p.pdf','-'],capture_output=True,text=True).stdout
              print('CHARS',len(txt)); print(txt)
              for k in ['PY15','PY 15','PY-15','Mariscal','Pozo Hondo','Carmelo','Transchaco','PY09','Loma Plata']:
                  j=txt.find(k)
                  if j>=0: print('---',k,':',txt[max(0,j-300):j+400].replace('\n',' | '))
          PY
          python3 /tmp/d.py
