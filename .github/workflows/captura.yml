name: Captura temporal del mapa
on:
  push:
    branches: [captura-mapa]
jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: |
          cat > /tmp/c.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const urls = JSON.parse(require('fs').readFileSync('data/fuentes.json','utf8')).fuentes.filter(f=>/^ar-seguridad-paso/.test(f.id)).map(f=>f.url);
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ timezoneId: 'America/Argentina/Salta', locale: 'es-AR' });
            for (const u of urls) {
              const html = await (await fetch(u)).text();
              console.log('=== ' + u + ' len ' + html.length);
              for (const k of ['Horario','Atenci','Cerrado','Abierto','provista']) {
                let i = -1, n = 0;
                while ((i = html.indexOf(k, i + 1)) >= 0 && n < 3) { n++; console.log('--- ' + k + ' @' + i + ': ' + html.slice(Math.max(0,i-400), i+500).replace(/\s+/g,' ')); }
              }
              const p = await ctx.newPage();
              await p.goto(u, { waitUntil: 'networkidle', timeout: 60000 });
              await p.waitForTimeout(3000);
              const est = await p.evaluate(() => { const r=[]; document.querySelectorAll('*').forEach(e=>{ if(e.children.length===0 && /^(Abierto|Cerrado|Habilitado|Inhabilitado|Condicionado)/i.test((e.textContent||'').trim())) r.push(e.tagName+'.'+e.className+'#'+e.id+' ['+e.textContent.trim().slice(0,80)+'] parent '+e.parentElement.outerHTML.slice(0,300)); }); return r; });
              console.log('ESTADO DOM:', est.join('\n'));
              const scripts = await p.evaluate(() => [...document.scripts].map(s => s.src || ('inline:' + s.textContent.slice(0, 120).replace(/\s+/g,' '))).filter(s => /paso|horario|estado|abierto/i.test(s)));
              console.log('SCRIPTS:', scripts.join('\n'));
              const inl = await p.evaluate(() => [...document.scripts].filter(s=>!s.src && /Cerrado|Abierto/.test(s.textContent)).map(s=>s.textContent.slice(0,3000)));
              console.log('INLINE:', inl.join('\n#####\n'));
            }
            await b.close();
          })();
          JS
          node /tmp/c.cjs
