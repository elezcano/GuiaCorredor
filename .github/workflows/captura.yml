name: Captura temporal del mapa
on:
  push:
    branches: [captura-mapa]
jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: |
          for u in $(node -e "for (const f of require('./data/fuentes.json').fuentes) if (/^ar-seguridad-paso/.test(f.id)) console.log(f.url)"); do
            curl -sS -A 'Mozilla/5.0' "$u" -o /tmp/p.html
            echo "=== $u"
            python3 -c "
          import re;h=open('/tmp/p.html',encoding='utf-8').read();i=h.index('var fechaSchema');j=h.index('switch(boton)');print(re.sub(r'\s+',' ',h[i:j]))"
            echo "B64START"; gzip -9c /tmp/p.html | base64 -w0; echo; echo "B64END"
          done
