name: Captura temporal del mapa
on:
  push:
    branches: [captura-mapa]
jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - run: |
          base='https://rest-sit.mop.gob.cl/arcgis/rest/services/VIALIDAD/Emergencias_Vialidad/MapServer'
          curl -sS "$base/0?f=json" | python3 -c "import json,sys;d=json.load(sys.stdin);print('TIPO',d.get('geometryType'))"
          curl -sS "$base/0/query?where=REGION%20IN%20('01','02')&outFields=*&returnGeometry=true&outSR=4326&f=json" -o /tmp/cl.json
          python3 -c "import json;d=json.load(open('/tmp/cl.json'));print('N',len(d['features']));[print(f['attributes']['REGION'],f['attributes']['ROL'],f['geometry']) for f in d['features']]"
          echo "B64"; gzip -9c /tmp/cl.json | base64 -w0; echo; echo "FIN"
