# Revisa y genera la web en cada cambio. Publica en GitHub Pages al subir a main.
# Publica en GitHub Pages en cada cambio en main (requiere Settings → Pages → Source: "GitHub Actions").
# La dirección de la web está en data/site.json (url y basePath). Las variables de repositorio
# SITE_URL y BASE_PATH (opcionales) la sobrescriben. Para pausar la publicación: variable PUBLICAR = false.
# Ojo: GitHub Pages en repositorios privados requiere un plan de pago de GitHub.
name: Publicar web

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  # Cada 3 horas: recoge los tiempos de cruce nuevos y vuelve a publicar.
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Cada rama o PR tiene su propia cola: un PR ya no cancela el despliegue de main ni otros PR.
# Los PR van por su número y no por github.ref: si el PR ya está fusionado cuando arranca su
# ejecución, github.ref puede valer refs/heads/main y cancelaba la publicación de main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - name: Coherencia web / api/v1
        run: node scripts/prueba-api.mjs
      - name: Verificaciones nuevas (requieren la etiqueta revision-editorial)
        if: github.event_name == 'pull_request'
        env:
          REVISION_EDITORIAL: ${{ contains(github.event.pull_request.labels.*.name, 'revision-editorial') }}
        run: node scripts/verificaciones.mjs origin/${{ github.base_ref }}
      - name: Comprobar enlaces internos
        run: npm run enlaces
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        # Nunca desde un PR (aunque ya esté fusionado): solo push, cron o lanzamiento manual en main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLICAR != 'false'
        with:
          path: dist

  # Pruebas de navegador (pruebas/LEEME.md): abren la web en Chromium a tamaño móvil, en tema claro y
  # oscuro, con datos y reloj fijos. Si alguna falla, no se publica.
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Ejecutar pruebas de navegador
        run: npm run pruebas
        env:
          SALIDA: ${{ runner.temp }}/capturas
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-pruebas
          path: ${{ runner.temp }}/capturas
          retention-days: 7

  publicar:
    # Nunca desde un PR (aunque ya esté fusionado): solo push, cron o lanzamiento manual en main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLICAR != 'false'
    needs: [construir, pruebas]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
