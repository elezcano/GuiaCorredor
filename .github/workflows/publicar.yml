# Revisa y genera la web en cada cambio. Publica en GitHub Pages al subir a main.
# Publica en GitHub Pages en cada cambio en main (requiere Settings → Pages → Source: "GitHub Actions").
# La dirección de la web está en data/site.json (url y basePath). Las variables de repositorio
# SITE_URL y BASE_PATH (opcionales) la sobrescriben. Para pausar la publicación: variable PUBLICAR = false.
# Ojo: GitHub Pages en repositorios privados requiere un plan de pago de GitHub.
name: Publicar web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Cada 3 horas: recoge los tiempos de cruce nuevos y vuelve a publicar.
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && vars.PUBLICAR != 'false'
        with:
          path: dist

  publicar:
    if: github.ref == 'refs/heads/main' && vars.PUBLICAR != 'false'
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
